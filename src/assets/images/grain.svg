<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="5" seed="7" stitchTiles="stitch" result="n"></feTurbulence>
    <feDiffuseLighting in="n" lighting-color="#ffffff" surface-scale="2.4">
      <feDistantLight azimuth="45" elevation="62"></feDistantLight>
    </feDiffuseLighting>
  </filter>
  <filter id="g">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch"></feTurbulence>
    <feColorMatrix type="saturate" values="0"></feColorMatrix>
  </filter>
  <rect width="600" height="600" filter="url(#p)"></rect>
  <rect width="600" height="600" filter="url(#g)" opacity="0.6"></rect>
</svg>