# Builds the desktop apps. Push a tag like v1.0.0 to publish a GitHub Release with both downloads.
# Or run it by hand (Actions > Release > Run workflow): with a tag it tags this commit and publishes the
# release; without one it only builds the downloads as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.0.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: release/*.exe
          - os: macos-latest
            target: --mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no paid certificate yet: Windows unsigned, Mac ad-hoc signed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Pure Poker Sim ${{ inputs.tag || github.ref_name }}
          files: out/*
          body: |
            **Pure Poker Sim**, a production of The Rayze Company.

            Learn Texas Hold'em against characters from Community, The Office, The Good Place, Parks and Recreation, Brooklyn Nine-Nine and Superstore. Every opponent plays strong, theory-based poker with its own small personality twist, and a built-in coach explains your options and reviews every hand.

            - No-limit, pot-limit or fixed-limit; cash games or tournaments; 1–7 opponents
            - Fair dealing: a cryptographic shuffle, tested every build against true poker odds ([FAIRNESS.md](https://github.com/${{ github.repository }}/blob/${{ inputs.tag || github.ref_name }}/docs/FAIRNESS.md))
            - Win-chance readout, hand rankings, a poker glossary, and a two-minute How to Play guide
            - Fully offline, free and open source (MIT)

            **Download**
            - **Windows:** `Pure-Poker-Sim-*-Windows.exe`. Double-click it; nothing to install. If SmartScreen warns, choose *More info → Run anyway*.
            - **Mac (Intel and Apple Silicon):** `Pure-Poker-Sim-*-Mac.dmg`. Open it and drag Pure Poker Sim to Applications. The first time, right-click the app and choose *Open*.
